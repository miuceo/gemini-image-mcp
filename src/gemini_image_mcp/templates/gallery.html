<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemini Image Gallery</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --surface-2: #eef0f3;
    --text: #1a1d21;
    --text-dim: #5b6270;
    --border: #dde1e6;
    --accent: #4f6df5;
    --accent-contrast: #ffffff;
    --badge-generate: #2f9e58;
    --badge-edit: #b1740f;
    --danger: #d64545;
    --shadow: 0 1px 3px rgba(20, 22, 26, 0.08), 0 1px 2px rgba(20, 22, 26, 0.06);
    --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.35);
    --radius: 12px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --surface: #1c1f24;
      --surface-2: #23272e;
      --text: #eceef1;
      --text-dim: #9aa1ad;
      --border: #2d323a;
      --accent: #7b93ff;
      --accent-contrast: #0d0f12;
      --badge-generate: #49c07c;
      --badge-edit: #e0a83f;
      --danger: #ff6b6b;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.4), 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.6);
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.4;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 16px 16px 12px;
  }

  h1 {
    margin: 0 0 12px;
    font-size: 1.35rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  h1 .count-pill {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-dim);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 10px;
  }

  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }

  .search-input {
    flex: 1 1 240px;
    min-width: 0;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 0.95rem;
  }

  .search-input:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
  }

  .kind-filter {
    display: flex;
    gap: 4px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 3px;
  }

  .kind-filter button {
    border: none;
    background: transparent;
    color: var(--text-dim);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 0.85rem;
    cursor: pointer;
    font-weight: 600;
  }

  .kind-filter button.active {
    background: var(--surface);
    color: var(--text);
    box-shadow: var(--shadow);
  }

  main {
    padding: 16px;
    max-width: 1600px;
    margin: 0 auto;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
  }

  .card .thumb-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: var(--surface-2);
    cursor: zoom-in;
    overflow: hidden;
  }

  .card .thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .thumb-wrap.broken::after {
    content: "Image unavailable";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 0.85rem;
    background: var(--surface-2);
    text-align: center;
    padding: 12px;
  }

  .card-body {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }

  .badges {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .badge {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--text-dim);
    border: 1px solid var(--border);
  }

  .badge.kind-generate { color: var(--accent-contrast); background: var(--badge-generate); border-color: transparent; }
  .badge.kind-edit { color: var(--accent-contrast); background: var(--badge-edit); border-color: transparent; }

  .timestamp {
    font-size: 0.75rem;
    color: var(--text-dim);
  }

  .prompt {
    font-size: 0.9rem;
    color: var(--text);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    cursor: pointer;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .prompt.expanded {
    -webkit-line-clamp: unset;
    display: block;
  }

  .sources {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }

  .sources .sources-label {
    font-size: 0.7rem;
    color: var(--text-dim);
    font-weight: 600;
  }

  .sources img {
    width: 36px;
    height: 36px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid var(--border);
  }

  .card-actions {
    margin-top: auto;
    display: flex;
    justify-content: flex-end;
  }

  .copy-btn {
    font-size: 0.75rem;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    cursor: pointer;
  }

  .copy-btn.copied {
    background: var(--badge-generate);
    color: #fff;
    border-color: transparent;
  }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 8px;
    padding: 80px 16px;
    color: var(--text-dim);
  }

  .empty-state .emoji {
    font-size: 2.5rem;
  }

  .empty-state h2 {
    color: var(--text);
    margin: 0;
  }

  .no-results {
    text-align: center;
    color: var(--text-dim);
    padding: 60px 16px;
  }

  /* Lightbox */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 24px;
  }

  .lightbox.open {
    display: flex;
  }

  .lightbox img {
    max-width: 100%;
    max-height: 85vh;
    box-shadow: var(--shadow-lg);
    border-radius: 8px;
  }

  .lightbox-caption {
    position: absolute;
    bottom: 16px;
    left: 16px;
    right: 16px;
    color: #f2f2f2;
    text-align: center;
    font-size: 0.85rem;
    max-height: 3.6em;
    overflow: hidden;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }

  .lightbox-close, .lightbox-nav {
    position: absolute;
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    font-size: 1.4rem;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .lightbox-close:hover, .lightbox-nav:hover {
    background: rgba(255, 255, 255, 0.25);
  }

  .lightbox-close { top: 16px; right: 16px; }
  .lightbox-nav.prev { left: 16px; top: 50%; transform: translateY(-50%); }
  .lightbox-nav.next { right: 16px; top: 50%; transform: translateY(-50%); }

  @media (max-width: 480px) {
    .lightbox-nav.prev { left: 4px; }
    .lightbox-nav.next { right: 4px; }
    .lightbox-close { top: 8px; right: 8px; }
  }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
</style>
</head>
<body>
<header>
  <h1>Gemini Image Gallery <span class="count-pill" id="countPill">0 images</span></h1>
  <div class="controls">
    <input type="text" class="search-input" id="searchInput" placeholder="Filter by prompt or model..." autocomplete="off">
    <div class="kind-filter" id="kindFilter" role="group" aria-label="Filter by kind">
      <button type="button" data-kind="all" class="active">All</button>
      <button type="button" data-kind="generate">Generated</button>
      <button type="button" data-kind="edit">Edited</button>
    </div>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="emoji">🖼️</div>
    <h2>No images yet</h2>
    <p>Generate or edit an image and it will show up here automatically.</p>
  </div>
  <div class="no-results" id="noResults" style="display:none;">No images match your filter.</div>
</main>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
  <button type="button" class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
  <button type="button" class="lightbox-nav prev" id="lightboxPrev" aria-label="Previous image">&#8249;</button>
  <img id="lightboxImg" src="" alt="">
  <button type="button" class="lightbox-nav next" id="lightboxNext" aria-label="Next image">&#8250;</button>
  <div class="lightbox-caption" id="lightboxCaption"></div>
</div>

<textarea id="copyFallback" class="visually-hidden" tabindex="-1" aria-hidden="true"></textarea>

<script type="application/json" id="records-data">/*__RECORDS_JSON__*/</script>
<script>
(function () {
  "use strict";

  var GENERATED_AT = "__GENERATED_AT__";

  var records = [];
  try {
    var raw = document.getElementById("records-data").textContent;
    records = JSON.parse(raw || "[]");
  } catch (e) {
    records = [];
  }
  if (!Array.isArray(records)) records = [];

  var state = {
    query: "",
    kind: "all"
  };

  var grid = document.getElementById("grid");
  var emptyState = document.getElementById("emptyState");
  var noResults = document.getElementById("noResults");
  var countPill = document.getElementById("countPill");
  var searchInput = document.getElementById("searchInput");
  var kindFilter = document.getElementById("kindFilter");

  var lightbox = document.getElementById("lightbox");
  var lightboxImg = document.getElementById("lightboxImg");
  var lightboxCaption = document.getElementById("lightboxCaption");
  var lightboxClose = document.getElementById("lightboxClose");
  var lightboxPrev = document.getElementById("lightboxPrev");
  var lightboxNext = document.getElementById("lightboxNext");
  var copyFallback = document.getElementById("copyFallback");

  var currentVisible = [];
  var currentIndex = -1;
  var lastFocused = null;

  function relativeTime(isoString) {
    var then = new Date(isoString);
    if (isNaN(then.getTime())) return "unknown time";
    var now = new Date();
    var diffMs = now.getTime() - then.getTime();
    var diffSec = Math.round(diffMs / 1000);
    var abs = Math.abs(diffSec);

    var units = [
      ["year", 31536000],
      ["month", 2592000],
      ["day", 86400],
      ["hour", 3600],
      ["minute", 60],
      ["second", 1]
    ];

    for (var i = 0; i < units.length; i++) {
      var name = units[i][0];
      var secs = units[i][1];
      if (abs >= secs || name === "second") {
        var value = Math.round(abs / secs);
        var plural = value === 1 ? "" : "s";
        if (diffSec >= 0) {
          return value + " " + name + plural + " ago";
        }
        return "in " + value + " " + name + plural;
      }
    }
    return "just now";
  }

  function formatAbsolute(isoString) {
    var d = new Date(isoString);
    if (isNaN(d.getTime())) return isoString || "";
    try {
      return d.toLocaleString();
    } catch (e) {
      return isoString;
    }
  }

  function matchesFilter(record) {
    if (state.kind !== "all" && record.kind !== state.kind) return false;
    if (!state.query) return true;
    var q = state.query.toLowerCase();
    var prompt = (record.prompt || "").toLowerCase();
    var model = (record.model || "").toLowerCase();
    return prompt.indexOf(q) !== -1 || model.indexOf(q) !== -1;
  }

  function buildSourceThumb(relPath) {
    var wrap = document.createElement("div");
    var img = document.createElement("img");
    img.loading = "lazy";
    img.alt = "Source image";
    img.src = relPath;
    img.onerror = function () {
      img.onerror = null;
      wrap.classList.add("broken-src");
      img.style.background = "var(--surface-2)";
    };
    wrap.appendChild(img);
    return wrap;
  }

  function buildCard(record, index) {
    var card = document.createElement("div");
    card.className = "card";
    card.dataset.index = String(index);

    var thumbWrap = document.createElement("div");
    thumbWrap.className = "thumb-wrap";
    var img = document.createElement("img");
    img.loading = "lazy";
    img.src = record.image_path || "";
    img.alt = record.prompt ? record.prompt.slice(0, 120) : "Generated image";
    img.onerror = function () {
      img.onerror = null;
      img.style.display = "none";
      thumbWrap.classList.add("broken");
    };
    thumbWrap.appendChild(img);
    thumbWrap.addEventListener("click", function () {
      openLightboxAt(index);
    });
    card.appendChild(thumbWrap);

    var body = document.createElement("div");
    body.className = "card-body";

    var badges = document.createElement("div");
    badges.className = "badges";

    var kindBadge = document.createElement("span");
    kindBadge.className = "badge kind-" + (record.kind === "edit" ? "edit" : "generate");
    kindBadge.textContent = record.kind === "edit" ? "Edit" : "Generate";
    badges.appendChild(kindBadge);

    var modelBadge = document.createElement("span");
    modelBadge.className = "badge";
    modelBadge.textContent = record.model || "unknown model";
    badges.appendChild(modelBadge);

    body.appendChild(badges);

    var timestamp = document.createElement("div");
    timestamp.className = "timestamp";
    timestamp.textContent = relativeTime(record.created_at);
    timestamp.title = formatAbsolute(record.created_at);
    body.appendChild(timestamp);

    var prompt = document.createElement("div");
    prompt.className = "prompt";
    prompt.textContent = record.prompt || "(no prompt)";
    prompt.title = "Click to expand/collapse";
    prompt.addEventListener("click", function () {
      prompt.classList.toggle("expanded");
    });
    body.appendChild(prompt);

    if (record.kind === "edit" && Array.isArray(record.source_images) && record.source_images.length) {
      var sources = document.createElement("div");
      sources.className = "sources";
      var label = document.createElement("span");
      label.className = "sources-label";
      label.textContent = "Sources:";
      sources.appendChild(label);
      record.source_images.forEach(function (src) {
        sources.appendChild(buildSourceThumb(src));
      });
      body.appendChild(sources);
    }

    var actions = document.createElement("div");
    actions.className = "card-actions";
    var copyBtn = document.createElement("button");
    copyBtn.type = "button";
    copyBtn.className = "copy-btn";
    copyBtn.textContent = "Copy prompt";
    copyBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      copyPrompt(record.prompt || "", copyBtn);
    });
    actions.appendChild(copyBtn);
    body.appendChild(actions);

    card.appendChild(body);
    return card;
  }

  function copyPrompt(text, btn) {
    function showCopied() {
      var original = "Copy prompt";
      btn.textContent = "Copied!";
      btn.classList.add("copied");
      setTimeout(function () {
        btn.textContent = original;
        btn.classList.remove("copied");
      }, 1500);
    }

    function fallbackCopy() {
      try {
        copyFallback.value = text;
        copyFallback.style.position = "fixed";
        copyFallback.style.top = "-1000px";
        copyFallback.focus();
        copyFallback.select();
        document.execCommand("copy");
      } catch (e) {
        /* give up silently */
      }
      showCopied();
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(showCopied, fallbackCopy);
    } else {
      fallbackCopy();
    }
  }

  function render() {
    grid.innerHTML = "";

    countPill.textContent = records.length + (records.length === 1 ? " image" : " images");

    if (records.length === 0) {
      emptyState.style.display = "flex";
      noResults.style.display = "none";
      grid.style.display = "none";
      currentVisible = [];
      return;
    }

    emptyState.style.display = "none";

    var visible = [];
    for (var i = 0; i < records.length; i++) {
      if (matchesFilter(records[i])) {
        visible.push(i);
      }
    }
    currentVisible = visible;

    if (visible.length === 0) {
      grid.style.display = "none";
      noResults.style.display = "block";
      return;
    }

    grid.style.display = "grid";
    noResults.style.display = "none";

    var frag = document.createDocumentFragment();
    visible.forEach(function (recIndex) {
      frag.appendChild(buildCard(records[recIndex], recIndex));
    });
    grid.appendChild(frag);
  }

  function openLightboxAt(recordIndex) {
    var pos = currentVisible.indexOf(recordIndex);
    if (pos === -1) return;
    currentIndex = pos;
    showLightboxImage();
    lastFocused = document.activeElement;
    lightbox.classList.add("open");
    lightboxClose.focus();
  }

  function showLightboxImage() {
    if (currentIndex < 0 || currentIndex >= currentVisible.length) return;
    var record = records[currentVisible[currentIndex]];
    lightboxImg.src = record.image_path || "";
    lightboxImg.alt = record.prompt ? record.prompt.slice(0, 160) : "Generated image";
    lightboxCaption.textContent = record.prompt || "";
  }

  function closeLightbox() {
    lightbox.classList.remove("open");
    lightboxImg.src = "";
    if (lastFocused && typeof lastFocused.focus === "function") {
      lastFocused.focus();
    }
  }

  function showNext(delta) {
    if (currentVisible.length === 0) return;
    currentIndex = (currentIndex + delta + currentVisible.length) % currentVisible.length;
    showLightboxImage();
  }

  lightboxClose.addEventListener("click", closeLightbox);
  lightboxPrev.addEventListener("click", function () { showNext(-1); });
  lightboxNext.addEventListener("click", function () { showNext(1); });

  lightbox.addEventListener("click", function (e) {
    if (e.target === lightbox) closeLightbox();
  });

  document.addEventListener("keydown", function (e) {
    if (!lightbox.classList.contains("open")) return;
    if (e.key === "Escape") {
      closeLightbox();
    } else if (e.key === "ArrowLeft") {
      showNext(-1);
    } else if (e.key === "ArrowRight") {
      showNext(1);
    }
  });

  var searchDebounce = null;
  searchInput.addEventListener("input", function () {
    clearTimeout(searchDebounce);
    var value = searchInput.value;
    searchDebounce = setTimeout(function () {
      state.query = value.trim();
      render();
    }, 100);
  });

  kindFilter.addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-kind]");
    if (!btn) return;
    state.kind = btn.dataset.kind;
    Array.prototype.forEach.call(kindFilter.querySelectorAll("button"), function (b) {
      b.classList.toggle("active", b === btn);
    });
    render();
  });

  render();
})();
</script>
</body>
</html>
